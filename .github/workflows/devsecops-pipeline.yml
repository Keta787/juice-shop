# =====================================================================
#  DevSecOps CI/CD Pipeline  —  SAST + SCA + DAST
#  Proyecto: SGEMD  (práctica sobre OWASP Juice Shop, sin prototipo propio)
#  Ubicación en el repositorio:  .github/workflows/devsecops-pipeline.yml
#
#  Basado en el YAML del docente ("actividad punto 3.3"), con los siguientes
#  arreglos necesarios para que SÍ se ejecute y puedas tomar las capturas:
#    1) SAST: se ejecuta Semgrep por CLI (versión Community, SIN token) en
#       lugar de la acción antigua `returntocorp/semgrep-action@v1`, que hoy
#       exige un SEMGREP_APP_TOKEN.
#    2) DAST: se levanta Juice Shop con Docker en http://localhost:3000,
#       porque la URL del enunciado (juice-shop.herokuapp.com) está muerta.
#    3) SCA: se conserva Snyk, que sí requiere el secreto SNYK_TOKEN.
#    4) SCA: antes de Snyk se ejecuta `npm ci`, porque el escaneo fallaba con
#       "Missing node_modules folder" (Snyk no podía probar sin dependencias).
# =====================================================================

name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  # ------------------------------------------------------------------
  # SAST — Análisis Estático: revisa el código fuente sin ejecutarlo
  # ------------------------------------------------------------------
  sast_scan:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Semgrep (SAST)
        run: |
          python -m pip install --quiet semgrep
          semgrep scan --config auto --text
        continue-on-error: true   # no rompe el pipeline; deja el reporte/log

  # ------------------------------------------------------------------
  # SCA — Análisis de Dependencias: audita librerías de terceros (CVE)
  # ------------------------------------------------------------------
  sca_scan:
    name: SCA - Snyk
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Escaneo de Dependencias con Snyk (SCA)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}   # crear en Settings > Secrets
        with:
          args: --severity-threshold=high

  # ------------------------------------------------------------------
  # DAST — Análisis Dinámico: ataca la app EN EJECUCIÓN (como un atacante)
  # ------------------------------------------------------------------
  dast_scan:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [ sast_scan, sca_scan ]
    steps:
      # Se levanta Juice Shop en localhost porque la URL de Heroku del
      # enunciado (juice-shop.herokuapp.com) ya no está disponible.
      - name: Levantar OWASP Juice Shop (objetivo de pruebas)
        run: docker run -d -p 3000:3000 --name juice-shop bkimminich/juice-shop

      - name: Esperar a que la aplicación responda
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 5
          done

      - name: Escaneo DAST con OWASP ZAP (Baseline)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          allow_issue_writing: false      # evita que falle por permisos en un fork
          artifact_name: 'zap-report'     # nombre válido para GitHub (el default 'zap_scan' no es aceptado)
