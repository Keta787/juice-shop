name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  sast_scan:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código fuente
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ejecutar Semgrep (SAST)
        run: |
          python -m pip install --quiet semgrep
          semgrep scan --config auto --text
        continue-on-error: true

  sca_scan:
    name: SCA - Snyk
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código fuente
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Escaneo de Dependencias con Snyk (SCA)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  dast_scan:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [ sast_scan, sca_scan ]
    steps:
      - name: Levantar OWASP Juice Shop (objetivo de pruebas)
        run: docker run -d -p 3000:3000 --name juice-shop bkimminich/juice-shop
      - name: Esperar a que la aplicación responda
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 5
          done
      - name: Escaneo DAST con OWASP ZAP (Baseline)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          allow_issue_writing: false
